<h1>DBZ Personajes</h1>
<hr>
<div class="row">
    <div class="col">
        <app-dbz-list (deleteCharacter)="onDeleteCharacter($event)"
        [characterList] = "characters"></app-dbz-list>
    </div>
    <div class="col">
        <app-dbz-add-character (onNewCharacter)="onAddCharacter($event)"></app-dbz-add-character>
    </div>
</div>
